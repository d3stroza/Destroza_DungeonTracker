# Every push to main checks the version in the addon's .toc. Is there no
# release for that version yet, it builds the addon ZIP and publishes the
# release vX.Y.Z (WowUp installs and updates from these releases).
name: Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version
        id: v
        run: |
          NAME="${GITHUB_REPOSITORY#*/}"
          VERSION=$(grep -m1 '^## Version:' "${NAME}/${NAME}.toc" | sed 's/^## Version:[[:space:]]*//' | tr -d '\r')
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then echo "exists=1" >> "$GITHUB_OUTPUT"; else echo "exists=0" >> "$GITHUB_OUTPUT"; fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Build ZIP
        if: steps.v.outputs.exists == '0'
        run: zip -r "${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}.zip" Destroza_*/ -x "*.bak"
      - name: Patch notes from CHANGELOG.md
        if: steps.v.outputs.exists == '0'
        run: |
          awk -v v="## v${{ steps.v.outputs.version }}" '$0==v{on=1;next} /^## /{on=0} on' CHANGELOG.md > notes.md || true
          [ -s notes.md ] || echo "Siehe CHANGELOG.md" > notes.md
      - name: Publish release
        if: steps.v.outputs.exists == '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.v.outputs.name }} ${{ steps.v.outputs.version }}
          files: ${{ steps.v.outputs.name }}-${{ steps.v.outputs.version }}.zip
          body_path: notes.md
